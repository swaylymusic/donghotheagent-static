<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">GTA average price trend, April to June 2026</title>
  <desc id="desc">Average price rose from 1,051,969 dollars in April to 1,069,700 dollars in May, then eased to 1,058,658 dollars in June.</desc>
  <rect width="1200" height="650" fill="#fffdf9"/>
  <text x="80" y="74" fill="#123b5d" font-family="Arial, sans-serif" font-size="30" font-weight="700">GTA Average Price · Q2 2026</text>
  <text x="80" y="112" fill="#526b80" font-family="Arial, sans-serif" font-size="18">TRREB MLS average price, all home types</text>
  <g stroke="#e5ded2" stroke-width="2"><line x1="130" y1="520" x2="1110" y2="520"/><line x1="130" y1="400" x2="1110" y2="400"/><line x1="130" y1="280" x2="1110" y2="280"/><line x1="130" y1="160" x2="1110" y2="160"/></g>
  <g fill="#526b80" font-family="Arial, sans-serif" font-size="16" text-anchor="end"><text x="112" y="526">$1.04M</text><text x="112" y="406">$1.05M</text><text x="112" y="286">$1.06M</text><text x="112" y="166">$1.07M</text></g>
  <polyline points="220,424 620,180 1020,333" fill="none" stroke="#a77d3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#123b5d" stroke="#fff" stroke-width="5"><circle cx="220" cy="424" r="13"/><circle cx="620" cy="180" r="13"/><circle cx="1020" cy="333" r="13"/></g>
  <g fill="#123b5d" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle"><text x="220" y="388">$1.052M</text><text x="620" y="145">$1.070M</text><text x="1020" y="298">$1.059M</text></g>
  <g fill="#526b80" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><text x="220" y="565">April</text><text x="620" y="565">May</text><text x="1020" y="565">June</text></g>
</svg>
